<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SchemaAI</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="Home.css" />
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <button id="nav-home" class="icon-btn" title="返回主页">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
            </div>

            <a href="https://github.com/Nonexistent-fish/SchemaAI" target="_blank" class="logo-link" title="访问 GitHub 仓库">
                <img src="Images/SCHEMAAI logo.png" alt="SchemaAI" class="logo-img" onerror="this.src='https://via.placeholder.com/300x85?text=SchemaAI'">
            </a>

            <div class="header-right">
                <button id="nav-user" class="icon-btn" title="用户信息">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
                <button id="nav-settings" class="icon-btn" title="设置">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </div>

        <div id="view-home" class="view-section active">
            <h2 style="font-size: 16px; margin-bottom: 16px; color: var(--text-main);">选择生成模板</h2>
            <div class="template-grid">
                <div class="template-card" id="card-lesson-plan">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <h3>教案生成</h3>
                    <p>智能拆解课题，图文并茂排版。</p>
                </div>
                <div class="template-card" id="card-custom">
                    <div class="card-icon" style="color: var(--text-sub);">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    </div>
                    <h3>自定义模板</h3>
                    <p>自由配置文档标记与 AI 规则。</p>
                </div>
            </div>
        </div>

        <div id="view-main" class="view-section">
            <div class="form-container">
                <div class="input-group">
                    <label>授课班级</label>
                    <div class="custom-select-wrapper" id="class-select-wrapper">
                        <div class="custom-select-display" id="class-select-display">
                            <span id="class-select-display-text">请选择或添加</span>
                            <svg class="custom-select-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-select-dropdown" id="class-select-dropdown" style="display: none;"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label>课程名称</label>
                    <input type="text" id="course" value="" placeholder="请输入课程名称">
                </div>

                <div class="input-group">
                    <label>章节课题</label>
                    <div class="topic-input-wrapper" id="topic-wrapper">
                        <input type="text" id="topic" placeholder="输入大类，如：自动变速箱">
                        <button id="ai-topic-btn"><span class="ai-text">AI</span></button>
                    </div>
                    <div id="ai-topic-panel" class="topic-panel" style="display: none;">
                        <div id="topic-list" class="topic-list" style="position: relative;"></div>
                        <div id="drag-handle" class="drag-handle"><div class="drag-line"></div></div>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 8px;">
                    <div class="section-header">
                        <label style="margin: 0;">图文并茂</label>
                        <button id="add-img-btn" class="icon-btn small" title="导入图片">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <input type="file" id="img-upload-input" accept="image/png, image/jpeg, image/jpg" style="display: none;" multiple>
                    </div>
                    <div id="image-gallery" class="image-gallery"></div>
                </div>

                <div class="input-group">
                    <label>课程类型</label>
                    <div class="radio-group">
                        <input type="radio" id="theory" name="courseType" value="理论课" checked>
                        <label for="theory">理论</label>
                        <input type="radio" id="practical" name="courseType" value="实训课">
                        <label for="practical">实训</label>
                    </div>
                </div>

                <div class="input-group toggle-group">
                    <label for="need-postscript">自动生成“教学后记”</label>
                    <label class="switch">
                        <input type="checkbox" id="need-postscript" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="input-group">
                    <label>核心教学内容 (可选)</label>
                    <textarea id="content" rows="2" placeholder="输入侧重点..."></textarea>
                </div>

                <button id="generate-btn" class="primary-btn">执行生成</button>
                <div id="progress-container" class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div id="status-msg" class="status-msg"></div>
            </div>
        </div>

        <div id="view-user" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">用户信息</span></div>
            <div class="form-container">
                <div class="input-group"><label>教师姓名</label><input type="text" id="setting-teacher"></div>
                <div class="input-group"><label>所授专业</label><input type="text" id="setting-major"></div>
                <button class="primary-btn btn-save" id="save-user">保存配置</button>
            </div>
        </div>

        <div id="view-settings" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">API 与系统设置</span></div>
            <div class="form-container">
                <div class="input-group">
                    <label>默认启动页面</label>
                    <select id="setting-default-view" style="width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; background: var(--card-bg);"></select>
                </div>
                <div class="input-group"><label>模型标识Model</label><input type="text" id="setting-model"></div>
                <div class="input-group"><label>接口地址API_url</label><input type="text" id="setting-url"></div>
                <div class="input-group"><label>鉴权密钥API_key</label><input type="password" id="setting-key"></div>
                <button class="primary-btn btn-save" id="save-settings">保存设置</button>
            </div>
        </div>

        <div id="view-add-class" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">添加新班级</span></div>
            <div class="form-container">
                <div class="input-group"><label>班级标识名称</label><input type="text" id="new-class-input" placeholder="输入班级全称"></div>
                <button class="primary-btn btn-save" id="save-new-class">添加至列表</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div id="img-desc-modal" class="modal-content">
            <h3>图片简述</h3>
            <div class="input-group">
                <label>帮助大模型理解该图片的教学用途</label>
                <input type="text" id="current-img-desc" placeholder="例如：行星齿轮结构图...">
                <input type="hidden" id="current-img-id">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">取消</button>
                <button class="btn-save" id="save-img-desc">确认</button>
            </div>
        </div>
    </div>

    <div id="dev-toast" class="dev-toast">该模块正在开发中...</div>

    <script src="Home.js"></script>
</body>
</html>
