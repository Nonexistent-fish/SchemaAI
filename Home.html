<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SchemaAI</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="Home.css" />
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <button id="nav-home" class="icon-btn" title="返回主页">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
            </div>

            <a href="https://github.com/Nonexistent-fish/SchemaAI" target="_blank" class="logo-link" title="访问 GitHub 仓库">
                <img src="Images/SCHEMAAI logo.png" alt="SchemaAI" class="logo-img" onerror="this.src='https://via.placeholder.com/300x85?text=SchemaAI'">
            </a>

            <div class="header-right">
                <button id="nav-user" class="icon-btn" title="用户信息">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
                <button id="nav-settings" class="icon-btn" title="设置">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </div>

        <div id="view-home" class="view-section">
            <h2 style="font-size: 16px; margin-bottom: 16px; color: var(--text-main);">选择生成模板</h2>
            <div class="template-grid">
                <div class="template-card" id="card-lesson-plan">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <h3>教案生成</h3>
                    <p>智能拆解课题，图文并茂排版。</p>
                </div>
                <div class="template-card" id="card-custom" style="order:1;">
                    <div class="card-icon" style="color: var(--text-sub);">
                        <svg viewBox="0 0 24 24">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline> 
                        </svg>
                    </div>
                    <h3>自定义模板</h3>
                    <p>自由配置文档标记与 AI 规则。</p>
                </div>
            </div>
        </div>

        <div id="view-main" class="view-section">
            <div class="form-container">
                <div class="input-group">
                    <label>授课班级</label>
                    <div class="custom-select-wrapper" id="class-select-wrapper">
                        <div class="custom-select-display" id="class-select-display">
                            <span id="class-select-display-text">请选择或添加</span>
                            <svg class="custom-select-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-select-dropdown" id="class-select-dropdown" style="display: none;"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label>课程名称</label>
                    <input type="text" id="course" value="" placeholder="请输入课程名称" autocomplete="off" spellcheck="false">
                </div>

                <div class="input-group">
                    <label>章节课题</label>
                    <div class="topic-input-wrapper" id="topic-wrapper">
                        <input type="text" id="topic" placeholder="输入大类，如：自动变速箱" autocomplete="off" spellcheck="false">
                        <button id="ai-topic-btn"><span class="ai-text">AI</span></button>
                    </div>
                    <div id="ai-topic-panel" class="topic-panel" style="display: none;">
                        <div id="topic-list" class="topic-list" style="position: relative;"></div>
                        <div id="drag-handle" class="drag-handle"><div class="drag-line"></div></div>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 8px;">
                    <div class="section-header">
                        <label style="margin: 0;">图文并茂</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button id="clipboard-img-btn" class="icon-btn small" title="点击抓取剪贴板图片" type="button">
                                <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                            </button>
                            <button id="add-img-btn" class="icon-btn small" title="导入本地图片" type="button">
                                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                        <input type="file" id="img-upload-input" accept="image/*" style="display: none;" multiple>
                    </div>
                    <div id="image-gallery" class="image-gallery"></div>
                </div>

                <div class="input-group">
                    <label>课程类型</label>
                    <div class="radio-group">
                        <input type="radio" id="theory" name="courseType" value="理论课" checked>
                        <label for="theory">理论</label>
                        <input type="radio" id="practical" name="courseType" value="实训课">
                        <label for="practical">实训</label>
                    </div>
                </div>

                <div class="input-group toggle-group">
                    <label for="need-postscript">自动生成“教学后记”</label>
                    <label class="switch">
                        <input type="checkbox" id="need-postscript" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="input-group">
                    <label>核心教学内容 (可选)</label>
                    <textarea id="content" rows="2" placeholder="输入侧重点..." autocomplete="off" spellcheck="false"></textarea>
                </div>

                <div class="generate-action-bar">
                    <button id="generate-btn" class="primary-btn" style="margin-top: 0;">执行生成</button>
                    <button id="save-doc-btn" class="save-icon-btn" title="一键保存文档">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                </div>

                <div id="progress-container" class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div id="status-msg" class="status-msg"></div>
            </div>
        </div>

        <div id="view-user" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">用户信息</span></div>
            <div class="form-container">
                <div class="input-group"><label>教师姓名</label><input type="text" id="setting-teacher" autocomplete="off" spellcheck="false"></div>
                <div class="input-group"><label>所授专业</label><input type="text" id="setting-major" autocomplete="off" spellcheck="false"></div>
                <button class="primary-btn btn-save" id="save-user">保存配置</button>
            </div>
        </div>

        <div id="view-settings" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">API 与系统设置</span></div>
            <div class="form-container">
                <div class="input-group">
                    <label>默认启动页面</label>
                    <div class="custom-dropdown" id="setting-default-view-dropdown">
                        <div class="custom-dropdown-display">
                            <span id="setting-default-view-text">主页</span>
                            <span class="custom-dropdown-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
                        </div>
                        <div class="custom-dropdown-list">
                            <div class="custom-dropdown-item" data-value="view-home">主页</div>
                            <div class="custom-dropdown-item" data-value="view-main">教案生成页面</div>
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <label>默认搜索引擎</label>
                    <div class="custom-dropdown" id="setting-search-engine-dropdown">
                        <div class="custom-dropdown-display">
                            <span id="setting-search-engine-text">百度</span>
                            <span class="custom-dropdown-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
                        </div>
                        <div class="custom-dropdown-list">
                            <div class="custom-dropdown-item" data-value="baidu">百度</div>
                            <div class="custom-dropdown-item" data-value="bing">必应</div>
                            <div class="custom-dropdown-item" data-value="google">Google</div>
                        </div>
                    </div>
                </div>
                <div class="input-group"><label>模型标识Model</label><input type="text" id="setting-model" autocomplete="off" spellcheck="false"></div>
                <div class="input-group"><label>接口地址API_url</label><input type="text" id="setting-url" autocomplete="off" spellcheck="false"></div>
                <div class="input-group"><label>鉴权密钥API_key</label><input type="password" id="setting-key" autocomplete="new-password" spellcheck="false"></div>


                <div class="input-group" style="margin-top: 8px;">
                    <label>文件默认命名方式</label>
                    <div class="naming-container">
                        <div class="naming-group">
                            <div class="naming-combo">
                                <input type="text" id="naming-val-0" placeholder="模块1" autocomplete="off">
                                <div class="naming-combo-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                                <div class="naming-combo-list">
                                    <div class="naming-combo-item">课题</div>
                                    <div class="naming-combo-item">授课教师</div>
                                    <div class="naming-combo-item">日期</div>
                                    <div class="naming-combo-item">教学目的</div>
                                </div>
                            </div>
                            <div class="naming-sep" id="naming-sep-0" data-val="-">-</div>
                        </div>

                        <div class="naming-group">
                            <div class="naming-combo">
                                <input type="text" id="naming-val-1" placeholder="模块2" autocomplete="off">
                                <div class="naming-combo-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                                <div class="naming-combo-list">
                                    <div class="naming-combo-item">课题</div>
                                    <div class="naming-combo-item">授课教师</div>
                                    <div class="naming-combo-item">日期</div>
                                    <div class="naming-combo-item">教学目的</div>
                                </div>
                            </div>
                            <div class="naming-sep" id="naming-sep-1" data-val="-">-</div>
                        </div>

                        <div class="naming-group">
                            <div class="naming-combo">
                                <input type="text" id="naming-val-2" placeholder="模块3" autocomplete="off">
                                <div class="naming-combo-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                                <div class="naming-combo-list">
                                    <div class="naming-combo-item">课题</div>
                                    <div class="naming-combo-item">授课教师</div>
                                    <div class="naming-combo-item">日期</div>
                                    <div class="naming-combo-item">教学目的</div>
                                </div>
                            </div>
                            <div class="naming-sep" id="naming-sep-2" data-val="-">-</div>
                        </div>

                        <div class="naming-group">
                            <div class="naming-combo">
                                <input type="text" id="naming-val-3" placeholder="模块4" autocomplete="off">
                                <div class="naming-combo-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                                <div class="naming-combo-list">
                                    <div class="naming-combo-item">课题</div>
                                    <div class="naming-combo-item">授课教师</div>
                                    <div class="naming-combo-item">日期</div>
                                    <div class="naming-combo-item">教学目的</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="primary-btn btn-save" id="save-settings" style="margin-top:16px;">保存设置</button>
            </div>
            <div style="text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 16px; opacity: 0.7;">vision 1.0.0</div>
        </div>

        <div id="view-add-class" class="view-section">
            <div class="view-header"><button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button><span class="view-title">添加新班级</span></div>
            <div class="form-container">
                <div class="input-group"><label>班级名称</label><input type="text" id="new-class-input" placeholder="输入班级全称" autocomplete="off" spellcheck="false"></div>
                <button class="primary-btn btn-save" id="save-new-class">添加至列表</button>
            </div>
        </div>
        <div id="view-template-use" class="view-section">
            <div class="view-header">
                <button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button>
                <span class="view-title" id="template-use-title">模板名称</span>
                <button id="edit-template-btn" class="icon-btn" title="编辑模板" style="margin-left: auto;">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
            </div>
            <div class="form-container" style="overflow: visible;">
                <p id="template-use-desc" style="color: var(--text-sub); font-size:13px; margin-bottom:16px;"></p>
                <div id="template-use-controls-list"></div>
            </div>
        </div>
        <div id="view-custom" class="view-section">
            <div class="view-header">
                <button class="nav-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>返回</button>
                <span class="view-title">自定义模板</span>
                <button id="refresh-custom-btn" class="icon-btn" title="刷新控件列表" style="margin-left: auto;">
                    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
            </div>
            <div class="form-container" style="overflow: visible;">

                <div class="input-group">
                    <label>模板标题</label>
                    <input type="text" id="custom-template-title" placeholder="例如：新教案模板" autocomplete="off" spellcheck="false">
                </div>
                <div class="input-group">
                    <label>模板描述</label>
                    <input type="text" id="custom-template-desc" placeholder="简要描述此模板的用途" autocomplete="off" spellcheck="false">
                </div>

                <div id="custom-empty-state" style="display: none; text-align: center; padding: 40px 20px;">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--text-sub)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    <p style="color: var(--text-sub); font-size: 14px; margin-top: 16px;">未检测到内容控件<br>请在 Word 的「开发工具」中插入内容控件，并设置标记。</p>
                </div>
                <div id="custom-controls-list" style="display: none;"></div>
                <button id="save-template-btn" class="primary-btn btn-save" style="margin-top:16px;">保存模板</button>
            </div>
        </div>
    </div> 
    <div id="modal-overlay" class="modal-overlay">
        <div id="img-desc-modal" class="modal-content">
            <h3>图片简述</h3>
            <div class="input-group">
                <label>帮助大模型理解该图片的教学用途</label>
                <input type="text" id="current-img-desc" placeholder="例如：行星齿轮结构图..." autocomplete="off" spellcheck="false">
                <input type="hidden" id="current-img-id">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">取消</button>
                <button class="btn-save" id="save-img-desc">确认</button>
            </div>
        </div>
    </div>

    <div id="dev-toast" class="dev-toast">该模块正在开发中...</div>

    <script src="Home.js"></script>
    <script src="custom.js"></script>
</body>
</html>
